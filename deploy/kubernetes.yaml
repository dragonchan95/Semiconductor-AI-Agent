apiVersion: apps/v1
kind: Deployment
metadata:
  name: semiconductor-copilot
spec:
  replicas: 1
  selector:
    matchLabels: {app: semiconductor-copilot}
  template:
    metadata:
      labels: {app: semiconductor-copilot}
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: copilot
          image: semiconductor-copilot:1.0
          ports: [{containerPort: 8700}]
          env:
            - {name: APP_ENV, value: production}
            - {name: STATE_DIR, value: /state}
            - name: ENGINEER_TOKEN
              valueFrom:
                secretKeyRef: {name: semiconductor-copilot-auth, key: engineer-token}
          volumeMounts:
            - {name: state, mountPath: /state}
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
            limits: {cpu: "2", memory: "4Gi"}
          readinessProbe:
            httpGet: {path: /health, port: 8700}
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: semiconductor-copilot-state}
---
apiVersion: v1
kind: Service
metadata: {name: semiconductor-copilot}
spec:
  type: ClusterIP
  selector: {app: semiconductor-copilot}
  ports: [{port: 8700, targetPort: 8700}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: semiconductor-copilot-state}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
